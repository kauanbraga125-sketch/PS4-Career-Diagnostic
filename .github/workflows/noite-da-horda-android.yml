name: Noite da Horda Android

on:
  push:
    branches: [game/monster-rush-android]
    paths: ['monster-game/**', '.github/workflows/noite-da-horda-android.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: noite-da-horda-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Android packages and software display
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri ffmpeg
      - name: Cache pinned Godot and Android templates
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/godot
            ~/.local/share/godot/export_templates/4.5.1.stable
          key: porto-godot-4.5.1-android-v1
      - name: Official Godot 4.5.1 distribution
        run: |
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          if [ ! -f "$HOME/.local/bin/godot" ]; then
            curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
            unzip -q /tmp/godot.zip -d /tmp/godot-editor
            cp /tmp/godot-editor/Godot_v4.5.1-stable_linux.x86_64 "$HOME/.local/bin/godot"
            chmod +x "$HOME/.local/bin/godot"
          fi
          if [ ! -f "$HOME/.local/share/godot/export_templates/4.5.1.stable/android_debug.apk" ]; then
            curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
            unzip -j -q /tmp/templates.tpz templates/android_debug.apk templates/android_release.apk templates/version.txt -d "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Import and test playable game
        run: |
          mkdir -p monster-game/build
          touch monster-game/build/.gdignore
          godot --headless --path monster-game --editor --import 2>&1 | tee monster-game/build/import.log
          timeout 90 godot --headless --path monster-game -- --self-test 2>&1 | tee monster-game/build/test.log
          grep -q HORDE_TEST_OK monster-game/build/test.log
          if grep -E 'SCRIPT ERROR|HORDE_TEST_FAIL' monster-game/build/test.log; then exit 1; fi
      - name: Render actual game screenshots
        env:
          HORDE_CAPTURE_PATH: ${{ github.workspace }}/monster-game/build/NoiteDaHorda-menu.png
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          timeout 120 xvfb-run -a godot --path monster-game --rendering-method gl_compatibility --audio-driver Dummy -- --capture 2>&1 | tee monster-game/build/preview.log
          for screen in menu shop monsters worlds run pause capture-zombie capture-skeleton capture-masked capture-fly vehicle-count passengers perk tunnel-entry tunnel tunnel-exit city industrial airport gameover ritual credits; do test -s "monster-game/build/NoiteDaHorda-$screen.png"; done
          if grep -E 'SCRIPT ERROR' monster-game/build/preview.log; then exit 1; fi
      - name: Render and encode real animation preview
        env:
          HORDE_MOTION_PATH: ${{ github.workspace }}/monster-game/build/motion
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          timeout 600 xvfb-run -a godot --path monster-game --rendering-method gl_compatibility --audio-driver Dummy -- --motion-preview 2>&1 | tee monster-game/build/motion.log
          grep -q HORDE_MOTION_OK monster-game/build/motion.log
          if grep -E 'SCRIPT ERROR' monster-game/build/motion.log; then exit 1; fi
          ffmpeg -v error -y -framerate 30 -i monster-game/build/motion/frame-%04d.png -stream_loop -1 -i monster-game/assets/audio/midnight_run.ogg -t 24 -c:v libx264 -preset fast -crf 22 -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart monster-game/build/NoiteDaHorda-v0.4.0-movimento.mp4
          test -s monster-game/build/NoiteDaHorda-v0.4.0-movimento.mp4
      - name: Cache game signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/horde-debug.keystore
          key: noite-da-horda-debug-key-v1
      - name: Configure signed Android export
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/horde-debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/horde-debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Noite da Horda Development,O=Kauan,C=BR'
          fi
          python3 monster-game/tools/configure_export.py
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/horde-debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Export APK and verify signature
        run: |
          godot --headless --path monster-game --export-debug Android build/NoiteDaHorda-v0.4.0.apk 2>&1 | tee monster-game/build/export.log
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose monster-game/build/NoiteDaHorda-v0.4.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging monster-game/build/NoiteDaHorda-v0.4.0.apk > monster-game/build/apk-info.txt
          sha256sum monster-game/build/NoiteDaHorda-v0.4.0.apk > monster-game/build/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NoiteDaHorda-Android-v0.4.0
          path: |
            monster-game/build/*.apk
            monster-game/build/*.mp4
            monster-game/build/*.png
            monster-game/build/*.txt
            monster-game/README.md
          if-no-files-found: error
          retention-days: 30
      - name: Publish tested alpha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > monster-game/build/release-notes.md <<'NOTES'
          Alpha 0.4: túneis de verdade, com entrada na encosta, interior animado e saída para outra região. Primeiro túnel aos 600 m; intervalos seguintes acompanham a velocidade. Cemitério e cidade gratuitos; indústria 2200 moedas e aeroporto 3800.

          Recrute civis vivos de três modelos, com corridas, saltos e pânico. Cada monstro executa sua captura antes da conversão. Qualquer membro da horda pode capturar; soldados também viram monstros aleatórios. Cada captura rende uma alma. Recordes de almas e distância separados.

          Veículos maiores, voltados à horda: moto 2, carro 4, ônibus 8, caminhão 10, tanque 12 e avião 16 contatos individuais. Contador 1/4, 2/4, inclinação intermediária e virada apenas ao alcançar todos os contatos. Passageiros acenam nas janelas e saem como humanos para serem capturados; ônibus libera quatro. Bombas aéreas e terrestres com pavio aceso, helicópteros em duas alturas e grupos de ameaças crescentes por túnel. Perdas numerosas suavizam a dificuldade.

          Tabela animada de almas, níveis progressivos e moedas aleatórias ao completar cada nível. Missões visíveis na pausa alimentam o Ritual da Madrugada quando a partida acaba e o jogador volta ao menu: almas voam ao altar e a barra completa dá outro bônus. Recompensas pagas uma única vez. Preços de melhorias e skins reequilibrados.

          Corrida mais expressiva, poses de empurrar/capturar, poeira, brilhos e rastros. Novo sussurro Ki Ki Ki Ma Ma Ma: alexander / Orange Free Sounds, CC BY 4.0, convertido e normalizado; créditos no jogo e em ASSETS.md. Duas músicas originais, efeitos de almas e ritual, sons de criaturas, tiros e explosões. Fontes e prompts da arte built-in imagegen incluídos.

          Android 7+, OpenGL ES 3.0, ARMv7/ARM64. Pacote com versionCode 4, mesma chave de desenvolvimento das alphas anteriores para atualizar preservando compras e save. 228 verificações automatizadas, 22 capturas do motor, vídeo de 24 segundos com cenários preparados e entradas simuladas, assinatura e SHA-256 verificados. O vídeo usa a música original e não é benchmark; desempenho em telefone físico ainda precisa ser medido.

          Toque para pular, segure para saltar mais alto; durante a transformação Mosca, segure para descer e solte para subir. Quedas continuam definitivas e perder toda a horda encerra a partida. Funciona offline, sem anúncios ou pagamentos reais.
          NOTES
          if ! gh release view noite-da-horda-v0.4.0 >/dev/null 2>&1; then
            gh release create noite-da-horda-v0.4.0 --target "$GITHUB_SHA" --prerelease --title 'Noite da Horda alpha 0.4 — Android' --notes-file monster-game/build/release-notes.md
          fi
          gh release upload noite-da-horda-v0.4.0 monster-game/build/NoiteDaHorda-v0.4.0.apk monster-game/build/SHA256SUMS.txt monster-game/build/NoiteDaHorda-*.png monster-game/build/NoiteDaHorda-v0.4.0-movimento.mp4 --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NoiteDaHorda-build-logs
          path: |
            monster-game/build/*.log
            monster-game/build/*.png
