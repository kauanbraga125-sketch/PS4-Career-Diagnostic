name: Noite da Horda Android — teste v0.8.11

on:
  workflow_dispatch:
  push:
    branches: [build/noite-da-horda-v0811]
    paths: ['monster-game/**']

permissions:
  contents: read

concurrency:
  group: noite-da-horda-v0811
  cancel-in-progress: false

jobs:
  build-android-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Require full corrected 0.8.11 source tree
        run: |
          set -euo pipefail
          test -s monster-game/NOTAS-v0.8.11-correcoes.md || { echo 'FULL_SOURCE_MISSING: first upload v0.8.11 project sources to this branch, not v0.7.'; exit 1; }
          grep -q 'version/name="0.8.11"' monster-game/export_presets.cfg
          test -s monster-game/tests/vehicle_survivors_test.gd
          test -s monster-game/assets/art/creatures.png
          test -s monster-game/assets/art/terrain-v089.png
          echo 'v0.8.11 source markers verified'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK and dependencies
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Android build tools and headless rendering support
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri

      - name: Cache Godot 4.5.1 and Android templates
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/godot
            ~/.local/share/godot/export_templates/4.5.1.stable
          key: horda-godot-4.5.1-android-v2

      - name: Install official Godot 4.5.1
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          if [ ! -x "$HOME/.local/bin/godot" ]; then
            curl -fL --retry 3 -o /tmp/godot.zip 'https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip'
            mkdir -p /tmp/godot-editor
            unzip -q /tmp/godot.zip -d /tmp/godot-editor
            cp /tmp/godot-editor/Godot_v4.5.1-stable_linux.x86_64 "$HOME/.local/bin/godot"
            chmod +x "$HOME/.local/bin/godot"
          fi
          if [ ! -s "$HOME/.local/share/godot/export_templates/4.5.1.stable/android_debug.apk" ]; then
            curl -fL --retry 3 -o /tmp/templates.tpz 'https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz'
            unzip -j -q /tmp/templates.tpz templates/android_debug.apk templates/android_release.apk templates/version.txt -d "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Import project and inspect parser diagnostics
        run: |
          set -euo pipefail
          mkdir -p monster-game/build
          touch monster-game/build/.gdignore
          timeout 180 godot --headless --path monster-game --editor --import 2>&1 | tee monster-game/build/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR: Failed to load' monster-game/build/import.log; then exit 1; fi

      - name: Run focused v0.8.11 gameplay regression checks
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path monster-game --script res://tests/ci_smoke.gd 2>&1 | tee monster-game/build/test.log
          grep -q 'HORDE_CI_SMOKE_OK' monster-game/build/test.log
          if grep -E 'SCRIPT ERROR|HORDE_CI_SMOKE_FAIL|HORDE_VEHICLE_SURVIVORS_FAIL' monster-game/build/test.log; then exit 1; fi

      - name: Prepare separate testing app and development signature
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/horda-0811-testing.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/horda-0811-testing.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 3650 -dname 'CN=Noite da Horda Testing,O=Kauan,C=BR'
          fi
          python3 monster-game/tools/configure_export.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('monster-game/export_presets.cfg')
          s=p.read_text()
          assert 'package/unique_name="com.kauan.noitedahorda.local"' in s
          s=s.replace('package/unique_name="com.kauan.noitedahorda.local"', 'package/unique_name="com.kauan.noitedahorda.teste"')
          s=s.replace('package/name="Noite da Horda"', 'package/name="Noite da Horda Teste"')
          p.write_text(s)
          PY
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/horda-0811-testing.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Export APK and validate package
        run: |
          set -euo pipefail
          godot --headless --path monster-game --export-debug Android build/NoiteDaHorda-v0.8.11-teste.apk 2>&1 | tee monster-game/build/export.log
          test -s monster-game/build/NoiteDaHorda-v0.8.11-teste.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose monster-game/build/NoiteDaHorda-v0.8.11-teste.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging monster-game/build/NoiteDaHorda-v0.8.11-teste.apk > monster-game/build/apk-info.txt
          grep -q "package: name='com.kauan.noitedahorda.teste'" monster-game/build/apk-info.txt
          sha256sum monster-game/build/NoiteDaHorda-v0.8.11-teste.apk > monster-game/build/SHA256SUMS.txt
          echo 'Android v0.8.11 testing APK generated and verified'

      - name: Upload APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: NoiteDaHorda-v0.8.11-teste
          path: monster-game/build/NoiteDaHorda-v0.8.11-teste.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NoiteDaHorda-v0.8.11-build-logs
          path: monster-game/build/*.log
          if-no-files-found: ignore
