[project]
name = "ps4-career-diagnostic"
version = "0.1.0"
description = "Read-only PS4 memory diagnostic scanner for player-career starter points."
requires-python = ">=3.13"
dependencies = [
  "ps4debug>=1.0.0",
]

[project.scripts]
career-diag = "career_diag.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
